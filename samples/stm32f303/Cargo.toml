[package]
name = "stm32f303-samples"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Samples for the STM32F3 Discovery (STM32F303VC) using Waveshare e-paper displays."
repository.workspace = true
license.workspace = true

[[bin]]
name = "epd3in5g"
test = false

[lib]
test = false

[dependencies]
embassy-embedded-hal = { version = "0.6", features = ["defmt"] }
embassy-executor = { version = "0.10", features = [
  "defmt",
  "executor-thread",
  "platform-cortex-m"
] }
embassy-stm32 = { version = "0.6", features = [
  "defmt",
  "exti",
  "memory-x",
  "rt",
  "stm32f303vc",
  "time",
  "time-driver-any",
  "unstable-pac"
] }
embassy-sync = "0.8.0"

# Drop log output rather than hang if probe-rs detaches and leaves RTT in blocking mode. A hang
# between power on and power off would leave the panel at high voltage.
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"] }
static_cell = "2.1.1"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "1.0", features = ["print-defmt"] }

assign-resources = "0.5"
defmt.workspace = true
embassy-time.workspace = true
embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
epd-waveshare-async = { path = "../../epd-waveshare-async", features = ["defmt"] }

thiserror = { workspace = true, default-features = false }
